# Модели, которые участвуют в бенчмаркинге.
#
# Все SUT-слоты делят ОДИН эндпоинт: SUT_BASE_URL + SUT_API_KEY из .env
# (общие для всех слотов; задаются один раз). Для каждого слота:
#   model_id_env  — имя env-переменной с ID модели на эндпоинте (GET /v1/models)
#   max_tokens    — лимит генерации, передаётся в CLI (--max-tokens).
#                   Переопределяется опцией run.sh --max-tokens N.
#   precision     — метаданные для отчёта: bf16 / fp8 / q4_k_m ... (не влияет на запуск)
#
# Judge/expansion — отдельная модель (избегание self-bias). Если expansion не
# задан явно, run.sh подставляет judge. Пока judge не нужен — переменные в .env пустые.

sut_models:
  base_model:
    role: "base"
    model_id_env: SUT_MODEL_ID_BASE
    max_tokens: 16384   # reasoning-модель: часть лимита уходит на reasoning_content; ctx=130k
    precision: q4_k_m
  finetune_a:
    role: "finetune"
    model_id_env: SUT_MODEL_ID_FINETUNE_A
    max_tokens: 16384
    precision: q4_k_m
  finetune_b:
    role: "finetune"
    model_id_env: SUT_MODEL_ID_FINETUNE_B
    max_tokens: 16384
    precision: q4_k_m

judge:
  # OpenAI-совместимый эндпоинт судьи. Должна быть модель другой семьи, чем SUT.
  base_url_env: JUDGE_BASE_URL
  model_id_env: JUDGE_MODEL_ID
  api_key_env: JUDGE_API_KEY
  max_tokens: 4096

# Если null — expansion = judge (рекомендуемое по умолчанию).
expansion: null
