; php2shell range — OOM-easy Apache mod_php config (значения из ikow lab).
; Низкий memory_limit делает Chain D OOM-триггер детерминированным.
memory_limit = 32M
post_max_size = 256M
upload_max_filesize = 256M
max_input_vars = 100000
max_file_uploads = 100000
display_errors = On
error_reporting = E_ALL

[Session]
session.save_path = /tmp/sessions
; upload_progress включён по умолчанию, но фиксируем явно: это и есть attack surface.
session.upload_progress.enabled = On
; cleanup=Off — сессии не удаляются после upload (детерминизм Chain A + следы для detection).
session.upload_progress.cleanup = Off
